 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLSKY | Futebol ao vivo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1425;color:#fff;font-family:Arial,sans-serif}
header{background:#111f35;padding:24px;border-bottom:1px solid #263750}
.wrap{max-width:1000px;margin:auto;padding:20px}
.brand{font-size:32px;font-weight:bold}
.brand span{color:#39e58c}
h1{font-size:32px}
p{color:#aabbd0}
button{background:#39e58c;color:#081b12;border:0;padding:14px 22px;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.game{background:#15243b;border:1px solid #293e58;border-radius:12px;padding:20px;margin:15px 0}
.league{color:#aabbd0;font-size:13px;margin-bottom:20px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.team img{width:48px;height:48px;object-fit:contain}
.team strong{display:block;margin-top:8px}
.score{font-size:28px;font-weight:bold}
.live{color:#39e58c;margin-top:18px;font-size:14px}
#status{margin:20px 0;color:#aabbd0}
footer{text-align:center;padding:30px;color:#aabbd0;font-size:13px}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="brand">⚽ GOL<span>SKY</span></div>
<p>O mundo do futebol em um só lugar</p>
</div>
</header>
<main class="wrap">
<h1>Futebol ao vivo</h1>
<p>Acompanhe partidas e placares reais.</p>
<button id="refresh">↻ Consultar jogos</button>
<div id="status" aria-live="polite">
Clique no botão para consultar as partidas.
</div>
<div id="games"></div>
</main>
<footer>GOLSKY • Dados fornecidos pela API-Football</footer>
<script>
const games=document.getElementById("games");
const statusBox=document.getElementById("status");
const button=document.getElementById("refresh");

function element(tag,cls,text){
 const el=document.createElement(tag);
 el.className=cls;
 if(text!==undefined)el.textContent=text;
 return el;
}

function team(data){
 const el=element("div","team");
 const img=document.createElement("img");
 img.src=data.logo;
 img.alt="";
 img.loading="lazy";
 el.append(img,element("strong","",data.name));
 return el;
}

async function loadGames(){
 button.disabled=true;
 statusBox.textContent="Consultando partidas...";
 try{
  const res=await fetch("/api/jogos");
  const data=await res.json();

  if(!res.ok || Object.keys(data.errors||{}).length){
   throw new Error("Consulta temporariamente indisponível.");
  }

  if(!Array.isArray(data.response)){
   throw new Error("Resposta inválida.");
  }

  games.replaceChildren();

  data.response.forEach(g=>{
   const card=element("article","game");
   const league=element("div","league",
    g.league.country+" • "+g.league.name);
   const teams=element("div","teams");
   const score=element("div","score",
    (g.goals.home??"-")+" : "+(g.goals.away??"-"));

   teams.append(team(g.teams.home),score,team(g.teams.away));

   const live=element("div","live",
    "● AO VIVO • "+(g.fixture.status.elapsed??0)+" min");

   card.append(league,teams,live);
   games.append(card);
  });

  statusBox.textContent=data.response.length
   ? data.response.length+" partida(s) • Atualizado às "+
     new Date().toLocaleTimeString("pt-BR")
   : "Nenhuma partida ao vivo disponível.";

 }catch(e){
  statusBox.textContent="Não foi possível atualizar. Os dados anteriores, se exibidos, podem estar desatualizados.";
 }finally{
  let seconds=60;
  button.textContent="Aguarde "+seconds+"s";
  const timer=setInterval(()=>{
   seconds--;
   button.textContent="Aguarde "+seconds+"s";
   if(seconds<=0){
    clearInterval(timer);
    button.disabled=false;
    button.textContent="↻ Atualizar jogos";
   }
  },1000);
 }
}

button.addEventListener("click",loadGames);
</script>
</body>
</html>
