id="search"
class="search"
type="search"
placeholder="🔍 Pesquisar time ou campeonato"
aria-label="Pesquisar time ou campeonato"

>

<div class="filters">
<button class="filter active" data-filter="all">Todos</button>
<button class="filter" data-filter="live">🔴 Ao vivo</button>
<button class="filter" data-filter="scheduled">Agendados</button>

</div>

<div id="filtered"></div>

</main>

GOLSKY • Horário de Brasília • Dados fornecidos pela API-Football

<script>

const games=document.getElementById("games");
const statusBox=document.getElementById("status");
const button=document.getElementById("refresh");
const today=document.getElementById("today");
const search=document.getElementById("search");
const filtered=document.getElementById("filtered");

const TIMEZONE="America/Sao_Paulo";

let timer=null;
let loading=false;
let allGames=[];
let currentFilter="all";
let hasData=false;

const closedLeagues=new Set();

const liveCodes=["1H","2H","HT","ET","BT","P","LIVE"];
const scheduledCodes=["NS","TBD"];
const finishedCodes=["FT","AET","PEN","AWD","WO"];

const championships={
71:["🇧🇷 Brasileirão Série A","#168447",1],
72:["🇧🇷 Brasileirão Série B","#927014",2],
75:["🇧🇷 Brasileirão Série C","#b85d16",3],
76:["🇧🇷 Brasileirão Série D","#247da3",4],
73:["🇧🇷 Copa do Brasil","#087e86",5],
13:["🏆 Copa Libertadores","#8b692c",6],
11:["🏆 Copa Sul-Americana","#596879",7],
2:["🇪🇺 Champions League","#244bc1",8],
3:["🇪🇺 Europa League","#b75b18",9],
39:["🏴 Premier League","#713b99",10],
140:["🇪🇸 La Liga","#b53d42",11],
78:["🇩🇪 Bundesliga","#9d252e",12],
135:["🇮🇹 Campeonato Italiano","#215caa",13],
61:["🇫🇷 Ligue 1","#315d50",14],
94:["🇵🇹 Campeonato Português","#9b3445",15],
1:["🌍 Copa do Mundo","#78394d",16]
};

const countries={
"Brazil":["Brasil","🇧🇷"],
"Argentina":["Argentina","🇦🇷"],
"England":["Inglaterra","🏴"],
"Spain":["Espanha","🇪🇸"],
"Germany":["Alemanha","🇩🇪"],
"Italy":["Itália","🇮🇹"],
"France":["França","🇫🇷"],
"Portugal":["Portugal","🇵🇹"],
"Netherlands":["Holanda","🇳🇱"],
"Belgium":["Bélgica","🇧🇪"],
"Turkey":["Turquia","🇹🇷"],
"Scotland":["Escócia","🏴"],
"Mexico":["México","🇲🇽"],
"USA":["Estados Unidos","🇺🇸"],
"Canada":["Canadá","🇨🇦"],
"Japan":["Japão","🇯🇵"],
"China":["China","🇨🇳"],
"South-Korea":["Coreia do Sul","🇰🇷"],
"Saudi-Arabia":["Arábia Saudita","🇸🇦"],
"Qatar":["Catar","🇶🇦"],
"United-Arab-Emirates":["Emirados Árabes","🇦🇪"],
"Uruguay":["Uruguai","🇺🇾"],
"Paraguay":["Paraguai","🇵🇾"],
"Chile":["Chile","🇨🇱"],
"Colombia":["Colômbia","🇨🇴"],
"Peru":["Peru","🇵🇪"],
"Ecuador":["Equador","🇪🇨"],
"Bolivia":["Bolívia","🇧🇴"],
"Venezuela":["Venezuela","🇻🇪"],
"Australia":["Austrália","🇦🇺"],
"Russia":["Rússia","🇷🇺"],
"Ukraine":["Ucrânia","🇺🇦"],
"Poland":["Polônia","🇵🇱"],
"Greece":["Grécia","🇬🇷"],
"Switzerland":["Suíça","🇨🇭"],
"Austria":["Áustria","🇦🇹"],
"Denmark":["Dinamarca","🇩🇰"],
"Sweden":["Suécia","🇸🇪"],
"Norway":["Noruega","🇳🇴"],
"Finland":["Finlândia","🇫🇮"],
"Croatia":["Croácia","🇭🇷"],
"Serbia":["Sérvia","🇷🇸"],
"Romania":["Romênia","🇷🇴"],
"Czech-Republic":["República Tcheca","🇨🇿"],
"Hungary":["Hungria","🇭🇺"],
"India":["Índia","🇮🇳"],
"Indonesia":["Indonésia","🇮🇩"],
"Thailand":["Tailândia","🇹🇭"],
"Vietnam":["Vietnã","🇻🇳"],
"Malaysia":["Malásia","🇲🇾"],
"Egypt":["Egito","🇪🇬"],
"Morocco":["Marrocos","🇲🇦"],
"South-Africa":["África do Sul","🇿🇦"],
"Nigeria":["Nigéria","🇳🇬"],
"Tunisia":["Tunísia","🇹🇳"],
"Algeria":["Argélia","🇩🇿"],
"Israel":["Israel","🇮🇱"],

"Iraq":["Iraque","🇮🇶"],

};

const palette=[
"#176b45",
"#2549a5",
"#8b3c36",
"#70409b",
"#996020",
"#087b83",
"#96375e",
"#405b9a",
"#397245",
"#8a482b",
"#655397",
"#216b91",
"#9b3939",
"#716522",
"#476b77",
"#8a397c"
];

function leagueColor(id){
const number=Number(id)||0;
return palette[Math.abs(number)%palette.length];
}

function updateDate(){
today.textContent="📅 "+new Date().toLocaleDateString("pt-BR",{
timeZone:TIMEZONE,
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
});
}

function element(tag,cls,text){
const el=document.createElement(tag);
el.className=cls;
if(text!==undefined)el.textContent=text;
return el;
}

function normalize(text){
return String(text||"")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toLowerCase();
}

function team(data){
const el=element("div","team");
const img=document.createElement("img");

img.alt="";
img.loading="lazy";

img.onerror=()=>{
img.replaceWith(document.createTextNode("⚽"));
};

img.src="/escudos/"+data.id+".png";

el.append(img,element("strong","",data.name));

return el;
}

function leagueInfo(league){

if(championships[league.id]){
return championships[league.id];
}

const country=countries[league.country]||
[league.country||"Internacional","🌍"];

return [
country[1]+" "+country[0]+" • "+league.name,
leagueColor(league.id),
league.country==="Brazil"?20:100
];

}

function matchStatus(g){

const short=g.fixture.status.short;
const minute=g.fixture.status.elapsed;

switch(short){

case "NS":
return ["🕒 AGENDADO","scheduled"];

case "TBD":
return ["HORÁRIO A DEFINIR","scheduled"];

case "1H":
case "2H":
case "ET":
case "LIVE":
return [
"● AO VIVO"+(minute!=null?" • "+minute+" min":""),
"live"
];

case "HT":
return ["● INTERVALO","live"];

case "BT":
return ["INTERVALO DA PRORROGAÇÃO","live"];

case "P":
return ["● PÊNALTIS","live"];

case "FT":
return ["✓ ENCERRADO","finished"];

case "AET":
return ["ENCERRADO APÓS PRORROGAÇÃO","finished"];

case "PEN":
return ["ENCERRADO NOS PÊNALTIS","finished"];

case "PST":
return ["ADIADO","warning"];

case "CANC":
return ["CANCELADO","warning"];

case "ABD":
return ["ABANDONADO","warning"];

case "SUSP":
return ["SUSPENSO","warning"];

case "INT":
return ["INTERROMPIDO","warning"];

case "AWD":
return ["RESULTADO ATRIBUÍDO","finished"];

case "WO":
return ["ENCERRADO POR W.O.","finished"];

default:
return ["STATUS INDISPONÍVEL","warning"];

}
}

function matchDate(g){

if(g.fixture.status.short==="TBD"){
return "Horário a definir";
}

const date=new Date(g.fixture.date);

if(Number.isNaN(date.getTime())){
return "Data a confirmar";
}

const day=date.toLocaleDateString("pt-BR",{
timeZone:TIMEZONE
});

const hour=date.toLocaleTimeString("pt-BR",{
timeZone:TIMEZONE,
hour:"2-digit",
minute:"2-digit"
});

return "📅 "+day+" • 🕒 "+hour;

}

function applyFilters(){

if(!hasData)return;

const term=normalize(search.value.trim());

const list=allGames.filter(g=>{

const code=g.fixture.status.short;

if(currentFilter==="live"&&!liveCodes.includes(code)){
return false;
}

if(currentFilter==="scheduled"&&!scheduledCodes.includes(code)){
return false;
}

if(currentFilter==="finished"&&!finishedCodes.includes(code)){
return false;
}

const content=normalize([
g.teams.home.name,
g.teams.away.name,
g.league.name,
g.league.country,
leagueInfo(g.league)[0]
].join(" "));

return content.includes(term);

});

filtered.textContent=
"Exibindo "+list.length+" de "+allGames.length+" partidas";

renderGames(list);

}

function renderGames(list){

const groups=new Map();

if(!list.length){
games.replaceChildren(
element("div","empty","Nenhuma partida encontrada.")
);
return;
}

list.forEach(g=>{

const id=g.league.id;

if(!groups.has(id)){
groups.set(id,{
id:id,
info:leagueInfo(g.league),
matches:[]
});
}

groups.get(id).matches.push(g);

});

const ordered=Array.from(groups.values()).sort((a,b)=>
a.info[2]-b.info[2]||
a.info[0].localeCompare(b.info[0],"pt-BR")
);

const fragment=document.createDocumentFragment();

ordered.forEach(group=>{

const section=element("details","championship");

section.dataset.league=String(group.id);
section.open=!closedLeagues.has(String(group.id));

section.style.setProperty("--color",group.info[1]);

section.addEventListener("toggle",()=>{

if(section.open){
closedLeagues.delete(String(group.id));
}else{
closedLeagues.add(String(group.id));
}

});

const heading=element(
"summary","",
group.info[0]+" • "+group.matches.length+" jogo(s)"
);

section.append(heading);

group.matches.sort((a,b)=>
new Date(a.fixture.date)-new Date(b.fixture.date)
);

group.matches.forEach(g=>{

const card=element("article","game");

const dateBox=element(
"div","match-date",matchDate(g)
);

const teams=element("div","teams");

const score=element("div","score",
(g.goals.home??"-")+" : "+(g.goals.away??"-")
);

teams.append(
team(g.teams.home),
score,
team(g.teams.away)
);

const info=matchStatus(g);

const label=element(
"div",
"match-status "+info[1],
info[0]
);

card.append(dateBox,teams,label);

section.append(card);

});

fragment.append(section);

});

games.replaceChildren(fragment);

}

function countdown(){

clearInterval(timer);

let seconds=60;

button.disabled=false;
button.textContent="Atualizar • "+seconds+"s";

timer=setInterval(()=>{

seconds--;

button.textContent="Atualizar • "+seconds+"s";

if(seconds<=0){
clearInterval(timer);
loadGames();
}

},1000);

}

async function loadGames(){

if(loading)return;

loading=true;

clearInterval(timer);

updateDate();

button.disabled=true;
button.textContent="Consultando...";

try{

const res=await fetch("/api/jogos",{
cache:"no-store"
});

const data=await res.json();

if(!res.ok||Object.keys(data.errors||{}).length){
throw new Error("Consulta indisponível");
}

if(!Array.isArray(data.response)){
throw new Error("Resposta inválida");
}

allGames=data.response;
hasData=true;

applyFilters();

const liveCount=allGames.filter(g=>
liveCodes.includes(g.fixture.status.short)
).length;

const updated=data.golsky?.atualizadoEm
?new Date(data.golsky.atualizadoEm).toLocaleTimeString("pt-BR",{
timeZone:TIMEZONE
})
:null;

statusBox.textContent=allGames.length
?allGames.length+" partidas hoje • "+
liveCount+" ao vivo"+
(updated?" • Atualizado às "+updated:"")
:"Nenhuma partida disponível para hoje.";

if(data.golsky?.desatualizado){
statusBox.textContent+=" • ⚠ Dados desatualizados";
}

}catch(error){

statusBox.textContent=hasData
?"Não foi possível atualizar. Exibindo dados anteriores."
:"Não foi possível consultar as partidas. Tentaremos novamente.";

}finally{

loading=false;
countdown();

}

}

document.querySelectorAll(".filter").forEach(btn=>{

btn.addEventListener("click",()=>{

currentFilter=btn.dataset.filter;

document.querySelectorAll(".filter").forEach(b=>{
b.classList.toggle("active",b===btn);
});

applyFilters();

});

});

search.addEventListener("input",applyFilters);

button.addEventListener("click",loadGames);

loadGames();

</script>

<style>
.favorite-star{
  display:block;
  margin:10px auto 0;
  padding:5px 12px;
  background:transparent;
  border:1px solid #52647c;
  color:#aabbd0;
  font-size:24px;
  border-radius:8px;
  cursor:pointer;

.favorite-star.selected{
  color:#ffcc33;
  border-color:#ffcc33;
  background:#ffcc3315;
}
</style>

<script>
(function(){

const storageKey="golsky_favoritos";
let favoritos=new Set();

try{
  const saved=JSON.parse(
    localStorage.getItem(storageKey)||"[]"
  );
  if(Array.isArray(saved)){
    favoritos=new Set(saved.map(String));
  }
}catch(e){}

const favoriteButton=element(
  "button",
  "filter",
  "⭐ Meus favoritos"
);

favoriteButton.dataset.filter="favorites";

document.querySelector(".filters")
.appendChild(favoriteButton);

favoriteButton.addEventListener("click",()=>{

  currentFilter="favorites";

  document.querySelectorAll(".filter")
  .forEach(b=>{
    b.classList.toggle(
      "active",
      b===favoriteButton
    );
  });

  applyFilters();

});

const originalTeam=team;

team=function(data){

  const el=originalTeam(data);
  const id=String(data.id);

  const star=element(
    "button",
    "favorite-star"
  );

  star.type="button";

  function updateStar(){

    const selected=favoritos.has(id);

    star.textContent=selected?"★":"☆";

    star.classList.toggle(
      "selected",selected
    );

    star.title=selected
    ?"Remover dos favoritos"
    :"Adicionar aos favoritos";

    star.setAttribute(
      "aria-label",
      star.title+" - "+data.name
    );

    star.setAttribute(
      "aria-pressed",
      String(selected)
    );

  }

  updateStar();

  star.addEventListener("click",()=>{

    if(favoritos.has(id)){
      favoritos.delete(id);
    }else{
      favoritos.add(id);
    }

    try{
      localStorage.setItem(
        storageKey,
        JSON.stringify([...favoritos])
      );
    }catch(e){}

    applyFilters();

  });

  el.appendChild(star);

  return el;

};

const originalRender=renderGames;

renderGames=function(list){

  if(currentFilter==="favorites"){

    list=list.filter(g=>
      favoritos.has(String(g.teams.home.id))||
      favoritos.has(String(g.teams.away.id))
    );

    filtered.textContent=
      "Exibindo "+list.length+
      " partidas dos seus times favoritos";

    if(!list.length){

      games.replaceChildren(
        element(
          "div",
          "empty",
          favoritos.size
          ?"Seus times favoritos não têm partidas nesta seleção."
          :"Marque a estrela abaixo dos seus times preferidos."
        )
      );

      return;

    }

  }

  originalRender(list);

};

if(hasData){
  applyFilters();
}

})();
</script>

<script>
(function(){

const dialog=document.getElementById("event-dialog");
const listBox=document.getElementById("event-list");
const refresh=document.getElementById("event-refresh");

const memory=new Map();
const pending=new Map();

let selected=null;
let sequence=0;

function describe(e){

const detail=e.detail||"";

const names={
"Normal Goal":"Gol",
"Own Goal":"Gol contra",
"Penalty":"Gol de pênalti",
"Missed Penalty":"Pênalti perdido",
"Yellow Card":"Cartão amarelo",
"Red Card":"Cartão vermelho",
"Second Yellow card":"Segundo cartão amarelo",
"Goal cancelled":"Gol anulado",
"Penalty confirmed":"Pênalti confirmado"
};

if(e.type==="Goal"){
return ["⚽",names[detail]||"Gol"];
}

if(e.type==="Card"){
return [
/red/i.test(detail)?"🟥":"🟨",
names[detail]||"Cartão"
];
}

if(e.type==="subst"){
return ["🔄","Substituição"];
}

if(e.type==="Var"){
return ["📺",names[detail]||"Revisão do VAR"];
}

return ["•","Outro acontecimento"];

}

async function getEvents(id){

const old=memory.get(id);

if(old&&Date.now()-old.time<old.ttl){
return old.data;
}

if(pending.has(id)){
return pending.get(id);
}

const task=(async()=>{

try{

const res=await fetch(
"/api/eventos?id="+encodeURIComponent(id),
{cache:"no-store"}
);

const data=await res.json();

if(
!res.ok||
Object.keys(data.errors||{}).length||
!Array.isArray(data.response)
){
throw new Error("Eventos indisponíveis");
}

memory.set(id,{
time:Date.now(),
ttl:300000,
data
});

return data;

}catch(error){

const data=old?.data?.response
?{
...old.data,
golsky:{
...old.data.golsky,
desatualizado:true
}
}
:{erro:true};

memory.set(id,{
time:Date.now(),
ttl:120000,
data
});

return data;

}

})();

pending.set(id,task);

try{
return await task;
}finally{
pending.delete(id);
}

}

async function showEvents(){

if(!selected)return;

const id=String(selected.fixture.id);
const token=++sequence;

refresh.disabled=true;

listBox.textContent="Consultando lances...";

const data=await getEvents(id);

if(token!==sequence||!dialog.open)return;

refresh.disabled=false;

listBox.replaceChildren();

if(data.erro){

listBox.textContent=
"Lances temporariamente indisponíveis. Tente novamente em dois minutos.";

return;

}

if(data.golsky?.desatualizado){

listBox.append(
element(
"p",
"warning",
"Exibindo os últimos lances disponíveis."
)
);

}

if(!data.response.length){

listBox.append(
element(
"p",
"",
"Nenhum lance informado pela API até o momento."
)
);

return;

}

const events=[...data.response].sort(
(a,b)=>
(b.time?.elapsed??0)-(a.time?.elapsed??0)||
(b.time?.extra??0)-(a.time?.extra??0)
);

for(const e of events){

const [icon,label]=describe(e);

const minute=e.time?.elapsed==null
?"—"
:e.time.elapsed+
(e.time.extra?"+"+e.time.extra:"")+"'";

const row=element("div","event-line");
const text=element("div","");

text.append(
element(
"strong",
"",
label+(e.player?.name?" — "+e.player.name:"")
)
);

text.append(
element("small","",e.team?.name||"")
);

if(e.assist?.name){

text.append(
element(
"small",
"",
(e.type==="subst"
?"Outro jogador: "
:"Assistência: ")+e.assist.name
)
);

}

row.append(
element("span","",minute),
element("span","",icon),
text
);

listBox.append(row);

}

}

function openEvents(g){

selected=g;

document.getElementById("event-match")
.textContent=
g.teams.home.name+" × "+g.teams.away.name;

if(!dialog.open){
dialog.showModal();
}

showEvents();

}

document.getElementById("event-close")
.onclick=()=>dialog.close();

dialog.addEventListener("close",()=>{

sequence++;
selected=null;

});

refresh.onclick=showEvents;

const previousRender=renderGames;

renderGames=function(list){

previousRender(list);

document.querySelectorAll(".championship")
.forEach(section=>{

const leagueId=section.dataset.league;

let matches=list.filter(g=>
String(g.league.id)===leagueId
);

if(currentFilter==="favorites"){

let favorites=[];

try{
favorites=JSON.parse(
localStorage.getItem("golsky_favoritos")||"[]"
).map(String);
}catch(e){}

matches=matches.filter(g=>
favorites.includes(String(g.teams.home.id))||
favorites.includes(String(g.teams.away.id))
);

}

matches.sort((a,b)=>
new Date(a.fixture.date)-
new Date(b.fixture.date)
);

const cards=section.querySelectorAll(".game");

cards.forEach((card,index)=>{

const g=matches[index];

if(!g)return;

if(card.querySelector(".event-button"))return;

if(scheduledCodes.includes(
g.fixture.status.short
))return;

const btn=element(
"button",
"event-button",
"📋 Ver lances"
);

btn.type="button";

btn.onclick=()=>openEvents(g);

card.appendChild(btn);

});

});

};

if(hasData){
applyFilters();
}

})();
</script>

<script>
(function(){

const scores=new Map();
const highlights=new Map();

let initialized=false;
let lastResponse=null;
let audio=null;
let sound=false;
let onlyFavorites=true;

try{
onlyFavorites=
localStorage.getItem(
"golsky_goal_favorites"
)!=="false";
}catch(e){}

const controls=element(
"div","goal-controls"
);

const soundButton=element(
"button","goal-control"
);

const modeButton=element(
"button","goal-control"
);

soundButton.type="button";
modeButton.type="button";

controls.append(
soundButton,
modeButton
);

document.querySelector(".filters")
.before(controls);

const alerts=element("div","");
alerts.id="goal-alerts";

alerts.setAttribute(
"aria-live","polite"
);

document.body.appendChild(alerts);

function updateButtons(){

soundButton.textContent=sound
?"🔊 Som ativado"
:"🔇 Ativar som de gol";

soundButton.classList.toggle(
"enabled",sound
);

modeButton.textContent=onlyFavorites
?"⭐ Gols dos favoritos"
:"🌍 Gols de todos os times";

}

function playGoal(){

if(!sound||!audio)return;

try{

const now=audio.currentTime;

[523,659,784,1047].forEach(
(frequency,index)=>{

const oscillator=
audio.createOscillator();

const gain=audio.createGain();

oscillator.type="sine";
oscillator.frequency.value=frequency;

const start=now+index*.15;

gain.gain.setValueAtTime(
.12,start
);

gain.gain.exponentialRampToValueAtTime(
.001,start+.4
);

oscillator.connect(gain);
gain.connect(audio.destination);

oscillator.start(start);
oscillator.stop(start+.4);

});

}catch(e){}

}

soundButton.onclick=async()=>{

if(sound){

sound=false;

}else{

try{

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext)return;

if(!audio){
audio=new AudioContext();
}

await audio.resume();

sound=true;

playGoal();

}catch(e){

sound=false;

}

}

updateButtons();

};

modeButton.onclick=()=>{

onlyFavorites=!onlyFavorites;

try{

localStorage.setItem(
"golsky_goal_favorites",
String(onlyFavorites)
);

}catch(e){}

updateButtons();

};

function getFavorites(){

try{

return new Set(
JSON.parse(
localStorage.getItem(
"golsky_favoritos"
)||"[]"
).map(String)
);

}catch(e){

return new Set();

}

}

function notifyGoal(g,teamName){

const notice=element(
"div","goal-notice"
);

notice.append(
element(
"strong","","⚽ GOOOOOL!"
),

element(
"div","",teamName
),

element(
"div","",
g.teams.home.name+
" "+g.goals.home+
" × "+g.goals.away+
" "+g.teams.away.name
),

element(
"small","",
"Gol detectado na atualização do placar"
)

);

alerts.prepend(notice);

while(alerts.children.length>4){
alerts.lastElementChild.remove();
}

setTimeout(
()=>notice.remove(),
10000
);

playGoal();

}

function detectGoals(){

if(!hasData)return;

if(lastResponse===allGames)return;

lastResponse=allGames;

const favorites=getFavorites();

for(const g of allGames){

const id=String(g.fixture.id);

const home=g.goals.home;
const away=g.goals.away;

if(home==null||away==null){
continue;
}

const previous=scores.get(id);

scores.set(id,{home,away});

if(!initialized||!previous){
continue;
}

const code=g.fixture.status.short;

if(
!liveCodes.includes(code)&&
!finishedCodes.includes(code)
){
continue;
}

const homeGoal=home>previous.home;
const awayGoal=away>previous.away;

if(!homeGoal&&!awayGoal){
continue;
}

const favoriteMatch=
favorites.has(
String(g.teams.home.id)
)||
favorites.has(
String(g.teams.away.id)
);

if(onlyFavorites&&!favoriteMatch){
continue;
}

highlights.set(
id,Date.now()+15000
);

if(homeGoal){
notifyGoal(g,g.teams.home.name);
}

if(awayGoal){
notifyGoal(g,g.teams.away.name);
}

}

initialized=true;

}

function highlightGoals(){

const term=normalize(
search.value.trim()
);

const favorites=getFavorites();

const matches=allGames.filter(g=>{

const code=g.fixture.status.short;

if(
currentFilter==="live"&&
!liveCodes.includes(code)
)return false;

if(
currentFilter==="scheduled"&&
!scheduledCodes.includes(code)
)return false;

if(
currentFilter==="finished"&&
!finishedCodes.includes(code)
)return false;

if(
currentFilter==="favorites"&&
!favorites.has(
String(g.teams.home.id)
)&&
!favorites.has(
String(g.teams.away.id)
)
)return false;

const content=normalize([
g.teams.home.name,
g.teams.away.name,
g.league.name,
g.league.country,
leagueInfo(g.league)[0]
].join(" "));

return content.includes(term);

});

document.querySelectorAll(
".championship"
).forEach(section=>{

const group=matches.filter(g=>
String(g.league.id)===
section.dataset.league
);

group.sort((a,b)=>
new Date(a.fixture.date)-
new Date(b.fixture.date)
);

section.querySelectorAll(
".game"
).forEach((card,index)=>{

const g=group[index];

if(!g)return;

const id=String(g.fixture.id);

const expires=highlights.get(id);

if(!expires)return;

const remaining=expires-Date.now();

if(remaining<=0){

highlights.delete(id);
return;

}

card.classList.add(
"goal-highlight"
);

setTimeout(()=>{

card.classList.remove(
"goal-highlight"
);

},remaining);

});

});

}

const previousRender=renderGames;

renderGames=function(list){

detectGoals();

previousRender(list);

highlightGoals();

};

updateButtons();

if(hasData){
applyFilters();
}

})();
</script>

<script>
(function(){

const flash=
document.getElementById("gol-flash");

const logo=
document.getElementById("gol-flash-logo");

const teamBox=
document.getElementById("gol-flash-team");

const scoreBox=
document.getElementById("gol-flash-score");

const leagueBox=
document.getElementById("gol-flash-league");

const labelBox=
document.getElementById("gol-flash-label");

const bar=
document.getElementById("gol-flash-bar");

const queue=[];

let showing=false;
let timer=null;

function nextFlash(){

if(showing||!queue.length)return;

const item=queue.shift();

showing=true;

labelBox.textContent=item.test
?"🧪 SIMULAÇÃO DE GOL"
:"🔴 ALERTA DE GOL";

teamBox.textContent=item.team;

scoreBox.textContent=item.score;

leagueBox.textContent=item.league||"";

logo.hidden=!item.id;

logo.onerror=()=>{
logo.hidden=true;
};

if(item.id){

logo.src=
"/escudos/"+item.id+".png";

}else{

logo.removeAttribute("src");

}

flash.classList.add("active");

bar.style.animation="none";

void bar.offsetWidth;

bar.style.animation=
"golFlashTempo 5s linear forwards";

timer=setTimeout(closeFlash,5000);

}

function closeFlash(){

clearTimeout(timer);

flash.classList.remove("active");

showing=false;

nextFlash();

}

function addFlash(item){

queue.push(item);

nextFlash();

}

document.getElementById(
"gol-flash-close"
).onclick=closeFlash;

document.addEventListener(
"keydown",e=>{

if(e.key==="Escape"&&showing){

closeFlash();

}

});

function readNotice(notice){

const parts=notice.children;

if(parts.length<3)return;

const teamName=parts[1].textContent;

const score=parts[2].textContent;

let found=null;
let teamId=null;

for(const g of allGames){

const expected=
g.teams.home.name+
" "+g.goals.home+
" × "+g.goals.away+
" "+g.teams.away.name;

if(expected!==score)continue;

if(g.teams.home.name===teamName){

found=g;
teamId=g.teams.home.id;
break;

}

if(g.teams.away.name===teamName){

found=g;
teamId=g.teams.away.id;
break;

}

}

addFlash({

team:teamName,

score:score,

id:teamId,

league:found
?leagueInfo(found.league)[0]
:""

});

}

const alerts=
document.getElementById("goal-alerts");

if(alerts){

const observer=new MutationObserver(
records=>{

for(const record of records){

for(const node of record.addedNodes){

if(
node.nodeType===1&&
node.classList.contains("goal-notice")
){

readNotice(node);

}

}

}

});

observer.observe(alerts,{
childList:true
});

}

const controls=
document.querySelector(".goal-controls");

if(controls){

const testButton=element(
"button",
"",
"⚽ Testar GOL FLASH"
);

testButton.id="gol-flash-test";
testButton.type="button";

testButton.onclick=()=>{

addFlash({

team:"FLAMENGO",

score:"Flamengo 2 × 1 Palmeiras",

id:127,

league:"Brasileirão Série A",

test:true

});

};

controls.appendChild(testButton);

}

})();
</script>
